 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="stopwatch.css">
 </head>
 <body>
    <div class="container">
        <div class="stopwatch">00:00:00</div>
        <div class="btns">
            <button type="button" class="btn btn-secondary startBtn">Start</button>
            <button type="button" class="btn btn-secondary stopBtn">Stop</button>
            <button type="button" class="btn btn-secondary continueBtn">Continue</button>
            <button type="button" class="btn btn-secondary restartBtn">Restart</button>
        </div>
    </div>
    <script src="stopwatch.js"></script>
 </body>
 </html>
